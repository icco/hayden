name: Test Go
on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hayden
          POSTGRES_PASSWORD: hayden
          POSTGRES_DB: hayden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hayden -d hayden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hayden:hayden@localhost:5432/hayden_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go get ./...
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...
